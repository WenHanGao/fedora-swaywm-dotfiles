# Basic actions.
# help: General | Mod + Enter | Open Foot terminal
bindsym $mod+Return exec $term
# help: General | Mod + Shift + Enter | Open Brave browser
bindsym $mod+Shift+Return exec $browser
# help: General | Mod + Alt + Enter | Open Herdr in the home directory
bindsym $mod+Mod1+Return exec $term --working-directory ~ $herdr
# help: General | Mod + Shift + Q | Close focused window
bindsym $mod+Shift+q kill
# help: General | Mod + Space | Toggle application launcher
bindsym $mod+space exec $menu
# help: General | Ctrl + Space | Toggle English / Chinese Pinyin
bindsym --no-repeat Ctrl+space exec fcitx5-remote -t
# help: General | Mod + K | Toggle this keybinding guide
bindsym $mod+k exec $keybindings
# help: General | Mod + N | Toggle notification center
bindsym $mod+n exec $notification_center
# help: General | Mod + Escape | Toggle power menu
bindsym $mod+Escape exec $power_menu
# help: General | Mod + Shift + L | Lock the session
bindsym $mod+Shift+l exec ~/.config/gtklock/lock --daemonize
# help: General | Mod + drag | Move a floating window
floating_modifier $mod normal
# help: General | Mod + Shift + C | Reload Sway
bindsym $mod+Shift+c reload
# help: General | Mod + Shift + B | Restart Quickshell
bindsym $mod+Shift+b exec sh -c 'quickshell kill; quickshell --daemonize --no-duplicate'
# help: General | Mod + Shift + E | Show exit prompt
bindsym $mod+Shift+e exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'

# Focus movement.
# help: Focus and movement | Mod + Tab | Cycle windows in the focused workspace
bindsym $mod+Tab focus next
# help: Focus and movement | Mod + Arrow keys | Focus in a direction
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Move the focused window.
# help: Focus and movement | Mod + Shift + Arrows | Move the focused window
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# Switch workspaces.
# help: Workspaces | Mod + 1…5 | Switch to workspace 1…5
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5

# Move the focused container to a workspace.
# help: Workspaces | Mod + Shift + 1…5 | Move window to workspace 1…5
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5

# Layouts and focus modes.
# help: Layout | Mod + B / V | Horizontal / vertical split
bindsym $mod+b splith
bindsym $mod+v splitv
# bindsym $mod+s layout stacking
# help: Layout | Mod + W | Tabbed layout
bindsym $mod+w layout tabbed
# help: Layout | Mod + E | Toggle split direction
bindsym $mod+e layout toggle split
# help: Layout | Mod + F | Toggle fullscreen
bindsym $mod+f fullscreen
# help: Layout | Mod + T | Toggle floating
bindsym $mod+t floating toggle
# help: Focus and movement | Mod + A | Focus parent container
bindsym $mod+a focus parent

# Scratchpad.
# help: Scratchpad | Mod + Shift + Minus | Move window to scratchpad
bindsym $mod+Shift+minus move scratchpad
# help: Scratchpad | Mod + Minus | Show a scratchpad window
bindsym $mod+minus scratchpad show

# Resize mode.
mode "resize" {
    # help: Resize mode | Arrow keys | Resize the focused window
    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px
    # help: Resize mode | Enter / Escape | Leave resize mode
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
# help: Layout | Mod + R | Enter resize mode
bindsym $mod+r mode "resize"

# Help-only entries for bindings inherited from Fedora or defined as gestures.
# help: Workspaces | Three-finger swipe left | Next workspace
# help: Workspaces | Three-finger swipe right | Previous workspace
# help: Hardware and media | Volume Up / Down | Adjust output volume
# help: Hardware and media | Audio Mute | Toggle output mute
# help: Hardware and media | Microphone Mute | Toggle microphone mute
# help: Hardware and media | Brightness Up / Down | Adjust display brightness
# help: Hardware and media | Play / Pause / Stop | Control media playback
# help: Hardware and media | Next / Previous | Change media track
# help: Hardware and media | Forward / Rewind | Seek ten seconds
