# Replace Fedora's layered Waybar configuration with Quickshell.
bar bar-0 {
    mode invisible
    swaybar_command true
}

# Quickshell owns org.freedesktop.Notifications, so release Dunst first.
exec_always --no-startup-id sh -c 'systemctl --user stop dunst.service; exec quickshell --daemonize --no-duplicate'
