# Personal settings loaded after Fedora's layered defaults.

# Keep compositor rendering pixel-aligned; applications and shell components
# define their own readable type and control sizes.
output * scale 1

# Tap the touchpad for a primary click instead of physically pressing it.
input type:touchpad {
    tap enabled
    natural_scroll disabled
    scroll_method two_finger
}

# Give tiled windows enough separation for the wallpaper to remain visible.
gaps inner 6
gaps outer 4

# Use a restrained border without a window title bar.
default_border pixel 2
default_floating_border pixel 2

# Keep focused, inactive, and urgent borders inside the Everforest palette.
# class                 border    background text      indicator child_border
client.focused          #a7c080   #a7c080   #2d353b   #a7c080   #a7c080
client.focused_inactive #475258   #343f44   #d3c6aa   #475258   #475258
client.unfocused        #3d484d   #2d353b   #9da9a0   #3d484d   #3d484d
client.urgent           #e67e80   #e67e80   #2d353b   #e67e80   #e67e80
client.placeholder      #56635f   #343f44   #d3c6aa   #56635f   #56635f
client.background       #2d353b
