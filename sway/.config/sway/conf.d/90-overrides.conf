# Personal settings loaded after Fedora's layered defaults.

# Slightly enlarge text and UI elements on displays.
output * scale 1.1

# Tap the touchpad for a primary click instead of physically pressing it.
input type:touchpad {
    tap enabled
    natural_scroll enabled
    scroll_method two_finger
}

# Leave more space between windows than around the screen edges.
gaps inner 2
gaps outer 1

# Use a thin border without a window title bar.
default_border pixel 2
default_floating_border pixel 2
