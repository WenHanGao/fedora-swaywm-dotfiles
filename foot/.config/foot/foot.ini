# Foot terminal configuration.

[main]
include=~/.config/foot/everforest.ini
font=Noto Sans Mono:weight=semibold:size=12
pad=16x12
resize-delay-ms=100
selection-target=clipboard

[scrollback]
lines=10000
multiplier=3.0

[colors-dark]
# Local presentation overrides for the included Everforest theme.
alpha=0.95
# Preserve the brighter terminal white used by this setup.
bright7=fff9e8

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
