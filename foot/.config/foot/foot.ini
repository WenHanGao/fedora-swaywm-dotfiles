# Foot terminal configuration.

[main]
font=Noto Sans Mono:weight=semibold:size=12
pad=16x12
resize-delay-ms=100
selection-target=clipboard

[scrollback]
lines=10000
multiplier=3.0

[colors-dark]
# Everforest dark, medium contrast.
foreground=d3c6aa
background=2d353b
alpha=0.95
cursor=2d353b d3c6aa
selection-foreground=d3c6aa
selection-background=475258
urls=7fbbb3

regular0=475258
regular1=e67e80
regular2=a7c080
regular3=dbbc7f
regular4=7fbbb3
regular5=d699b6
regular6=83c092
regular7=d3c6aa

bright0=7a8478
bright1=e67e80
bright2=a7c080
bright3=dbbc7f
bright4=7fbbb3
bright5=d699b6
bright6=83c092
bright7=fff9e8

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
