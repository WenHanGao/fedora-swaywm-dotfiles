# Simple two-line prompt using the canonical Everforest Dark Medium palette.

add_newline = false
palette = "everforest_dark_medium"
format = "$username$directory$git_branch$git_status$python$line_break$character"

[username]
format = "[$user]($style) "
style_user = "bold aqua"
style_root = "bold red"
show_always = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " ro"
read_only_style = "red"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$symbol$branch]($style) "
symbol = "git:"
style = "green"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
conflicted = "="
ahead = ">${count}"
behind = "<${count}"
diverged = "<>${ahead_count}/${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "r"
deleted = "x"

[python]
format = '[$symbol$version]($style)[ \($virtualenv\)](aqua) '
symbol = "py:"
style = "purple"
version_format = '${major}.${minor}'
detect_files = [
    ".python-version",
    "Pipfile",
    "__init__.py",
    "pyproject.toml",
    "requirements.txt",
    "setup.py",
    "tox.ini",
    "uv.lock",
]

# Keep these values synchronized with themes/everforest-dark-medium/palette.json.
[palettes.everforest_dark_medium]
red = "#e67e80"
yellow = "#dbbc7f"
green = "#a7c080"
aqua = "#83c092"
blue = "#7fbbb3"
purple = "#d699b6"
